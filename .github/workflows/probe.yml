name: probe
on:
  push:
    branches: [nt-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          B=https://site.api.espn.com/apis/site/v2/sports/soccer
          show() {
            python3 -c '
          import json,sys
          try: d=json.load(open(sys.argv[1]))
          except Exception as x: print("NOJSON", open(sys.argv[1],"rb").read()[:300]); sys.exit()
          ev=d.get("events",[])
          print(len(ev), [l.get("name") for l in d.get("leagues",[])], d.get("team",{}).get("displayName"))
          for e in ev[:40]:
              c=e["competitions"][0]
              t=[(x.get("homeAway"),x["team"].get("displayName"),x["team"].get("abbreviation"),x["team"].get("id"),x.get("score"),x.get("shootoutScore")) for x in c["competitors"]]
              print(e["date"], e.get("status",{}).get("type",{}).get("name") or c.get("status",{}).get("type",{}).get("name"), t, (c.get("venue") or {}).get("fullName"), (c.get("venue") or {}).get("address"), (e.get("season") or {}).get("slug"), [n.get("headline") for n in c.get("notes",[])][:1], (e.get("league") or c.get("league") or {}).get("slug") if isinstance(e.get("league") or c.get("league"),dict) else "")
          ' "$1"
          }
          get() { echo "=== $1"; curl -sS --compressed -m 30 -A "Mozilla/5.0" "$1" -o o.json -w "%{http_code} %{size_download}\n"; show o.json; }
          get "$B/uefa.nations/scoreboard?dates=20261113"
          get "$B/uefa.nations/scoreboard?dates=20261001"
          get "$B/uefa.nations/scoreboard?dates=2027"
          get "$B/uefa.nations/scoreboard?dates=20261101-20261130"
          get "$B/uefa.nations/scoreboard?limit=100&dates=20261112-20261117"
          get "$B/all/teams/481/schedule?fixture=true"
          get "$B/uefa.euroq/teams/481/schedule?fixture=true"
          get "$B/fifa.friendly/teams/164/schedule?fixture=true"
          get "$B/fifa.friendly/teams/164/schedule"
          get "$B/uefa.nations/teams/164/schedule?fixture=true"
          get "$B/fifa.world/teams/481/schedule"
          echo "=== core"; curl -sS --compressed -m 30 "https://sports.core.api.espn.com/v2/sports/soccer/leagues/uefa.nations/events?dates=20261101-20270630&limit=200" | head -c 600; echo
          echo "=== core2"; curl -sS --compressed -m 30 "https://sports.core.api.espn.com/v2/sports/soccer/leagues/fifa.friendly/events?dates=20261101-20270630&limit=200" | head -c 600; echo
          echo "=== cal"; curl -sS --compressed -m 30 "$B/fifa.friendly/scoreboard" | python3 -c "import json,sys; d=json.load(sys.stdin); L=d['leagues'][0]; print(L.get('calendarType'), L.get('calendarStartDate'), L.get('calendarEndDate'), str(L.get('calendar'))[:400])"
          echo "=== pen"; curl -sS --compressed -m 30 "$B/fifa.world/scoreboard?dates=20260704" | head -c 300; echo
