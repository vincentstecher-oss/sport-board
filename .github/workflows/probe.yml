name: probe
on:
  push:
    branches: [nt-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set +e
          B=https://site.api.espn.com/apis/site/v2/sports/soccer
          show() {
            python3 -c '
          import json,sys
          try: d=json.load(open(sys.argv[1]))
          except Exception as x: print("NOJSON", open(sys.argv[1],"rb").read()[:300]); sys.exit()
          ev=d.get("events",[])
          print(len(ev), [l.get("name") for l in d.get("leagues",[])], d.get("team",{}).get("displayName"))
          for e in ev[:40]:
              c=e["competitions"][0]
              t=[(x.get("homeAway"),x["team"].get("displayName"),x["team"].get("abbreviation"),x["team"].get("id"),x.get("score"),x.get("shootoutScore")) for x in c["competitors"]]
              print(e["date"], e.get("status",{}).get("type",{}).get("name") or c.get("status",{}).get("type",{}).get("name"), t, (c.get("venue") or {}).get("fullName"), (c.get("venue") or {}).get("address"), (e.get("season") or {}).get("slug"), [n.get("headline") for n in c.get("notes",[])][:1], (e.get("league") or c.get("league") or {}).get("slug") if isinstance(e.get("league") or c.get("league"),dict) else "")
          ' "$1"
          }
          get() { echo "=== $1"; curl -sS --compressed -m 30 -A "Mozilla/5.0" "$1" -o o.json -w "%{http_code} %{size_download}\n"; show o.json; }
          for t in 202 205 448 478 162 449 482 459 477 164 481; do echo "== team $t"; curl -sS --compressed -m 30 "$B/all/teams/$t/schedule?fixture=true" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('team',{}).get('displayName'), d.get('team',{}).get('abbreviation'), len(d.get('events',[]))); [print(' ', e['date'], e['name'], (e.get('league') or {}).get('slug'), (e.get('league') or {}).get('name')) for e in d.get('events',[])]"; done
          get "$B/all/teams/481/schedule"
          echo "=== summary"; curl -sS --compressed -m 30 "$B/fifa.world/summary?event=$(curl -sS --compressed "$B/fifa.world/teams/481/schedule" | python3 -c "import json,sys; print(json.load(sys.stdin)['events'][0]['id'])")" | python3 -c "
          import json,sys; d=json.load(sys.stdin); c=d['header']['competitions'][0]
          print(c['status']['type'], [(x['homeAway'], x['team']['displayName'], x.get('score'), x.get('shootoutScore')) for x in c['competitors']])"
          echo "=== sb pen"; curl -sS --compressed -m 30 "$B/fifa.world/scoreboard?dates=20260629" | python3 -c "
          import json,sys; d=json.load(sys.stdin)
          for e in d['events']:
              c=e['competitions'][0]; print(e['id'], e['date'], e['status']['type']['name'], e['status']['type'].get('completed'), [(x['team']['displayName'], x.get('score'), x.get('shootoutScore')) for x in c['competitors']])"
