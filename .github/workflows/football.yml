name: Fußball und Ergebnisse aktualisieren

# Spielpläne, Ergebnisse, Tabellen und Fußball-Termine aus den Feeds (scripts/football.py), Länderspiele des DFB-Teams und
# Duelle der Top-Nationen aus ESPN (scripts/national.py), danach Ergebnisse von
# Formel 1 (Jolpica), DFB-Pokal (OpenLigaDB) und Fußball-Terminen (scripts/results.py), ohne Claude.
# Cron läuft in UTC. Berlin ist im Winter UTC+1, im Sommer UTC+2; feste Berliner Zeiten stehen deshalb doppelt drin.
on:
  schedule:
    # morgens zweimal (Ergebnisse aus Asien, Australien und Las Vegas)
    - cron: "17 5,9 * * *"
    # ab Mittag bis Mitternacht UTC alle 30 Minuten (der Fußball-Feed trägt Ergebnisse verzögert ein)
    - cron: "17,47 12-23 * * *"
    # 22:30 Berlin, nach den Spielen und Rennen am Abend (20:30 UTC im Sommer, 21:30 UTC im Winter)
    - cron: "30 20,21 * * *"
    # 01:00 Berlin, nach den späten Spielen (23:00 UTC im Sommer, 00:00 UTC im Winter)
    - cron: "0 23,0 * * *"
    # Renn-Wochenenden (Sa und So): zusätzlich morgens nach Qualifying, Sprint und Rennen in Asien, Australien
    # und Las Vegas (Ende meist 05 bis 07 UTC). Europa und Amerika (Ende 13 bis 22 UTC) decken die Läufe oben ab.
    - cron: "17 7 * * 6,0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: board-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten aktualisieren und pushen
        env:
          WARN_FILE: ${{ runner.temp }}/warnings.txt
        run: |
          git config user.name "sport-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/football.py
            python3 scripts/national.py
            git diff --quiet && fb=0 || fb=1
            python3 scripts/results.py | tee "${{ runner.temp }}/results.txt"
            if git diff --quiet; then echo "Keine Änderung"; break; fi
            if grep -q '^Datei geändert' "${{ runner.temp }}/results.txt"; then
              msg="Ergebnisse"; [ "$fb" = 1 ] && msg="Fußball-Update und Ergebnisse"
            else
              msg="Fußball-Update"
            fi
            git commit -qam "$msg $(TZ=Europe/Berlin date +'%d.%m.%Y %H:%M')"
            if git push -q origin HEAD:main; then echo "Gepusht"; break; fi
            echo "Push abgelehnt, neuer Versuch"; sleep 10
          done
      - name: Warnungen
        if: always()
        run: |
          f="${{ runner.temp }}/warnings.txt"
          if [ -s "$f" ]; then echo "::warning::$(tr '\n' ' ' < "$f")"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
