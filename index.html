<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sport Board</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sport Board">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
@font-face { font-family: 'Archivo'; src: url('fonts/archivo.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
@font-face { font-family: 'Big Shoulders Display'; src: url('fonts/big-shoulders.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
</style>
<meta name="color-scheme" content="dark">
<meta name="app-version" content="2d5c2a1db6">
<style>
/* Sport Board: Übersicht, Kalender, Sport. Dunkel und ruhig, Rot nur für den FC Bayern, jede Sportseite mit eigenem Kopfbild. */
:root {
  color-scheme: dark;
  --bg: #0A0C10; --card: #12161D; --card-2: #181D26; --card-3: #202632;
  --line: rgba(236, 241, 248, 0.075); --line-2: rgba(236, 241, 248, 0.15);
  --fg: #EEF1F5; --muted: #8F98A6; --faint: #5D6674;
  --fcb: #DC2B3A; --fcb-ink: #F39AA3; --fcb-soft: rgba(220, 43, 58, 0.14);
  --live: #FF4B5C; --ok: #5BC48D; --warn: #E2B24C;
  --display: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', Impact, sans-serif;
  --sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --glow: rgba(150, 170, 200, 0.07); --tint: #A9B3C1; --hero: #12161D;
  --tabh: 64px;
}
body.th-fussball { --glow: rgba(110, 190, 140, 0.10); --tint: #9FB8A8; --hero: #0C1812; }
body.th-f1 { --glow: rgba(140, 200, 205, 0.09); --tint: #9FB5B4; --hero: #0B0E12; }
body.th-golf { --glow: rgba(190, 200, 140, 0.09); --tint: #AEB7A0; --hero: #0D1710; }
body.th-tennis { --glow: rgba(130, 190, 200, 0.10); --tint: #A3B8B2; --hero: #0C1A20; }
body.th-kampf { --glow: rgba(230, 150, 130, 0.10); --tint: #BCA6A1; --hero: #140C0E; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; background: radial-gradient(130% 380px at 50% -80px, var(--glow), transparent 72%) no-repeat, var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  overscroll-behavior-y: contain;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app { max-width: 1080px; margin: 0 auto; padding-bottom: calc(var(--tabh) + 36px + env(safe-area-inset-bottom, 0px)); }

/* Kopfleiste */
.bar { position: sticky; top: 0; z-index: 30; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-left, 0px)) 10px;
  background: rgba(10, 12, 16, 0.80); -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3); border-bottom: 1px solid transparent; transition: border-color .2s; }
.bar.scrolled { border-bottom-color: var(--line); }
.bar-in { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.bar h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.stamp { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--card-2); font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.stamp i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.stamp.old i { background: var(--warn); }
.stamp.busy i { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -2px; padding: 0 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--card-2); color: var(--muted); font-size: 13.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.chip svg { width: 16px; height: 16px; }
.chip[aria-pressed="true"] { background: var(--fg); color: #0A0C10; }
.chip .n { font-size: 11.5px; font-weight: 700; opacity: 0.6; }

/* Ziehen zum Aktualisieren */
.ptr { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 60; transform: translate(-50%, -70px); padding: 8px 14px; border-radius: 999px; background: var(--card-3); font-size: 12.5px; font-weight: 600; color: var(--fg); pointer-events: none; transition: transform .2s; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + 26px + env(safe-area-inset-bottom, 0px)); z-index: 70; transform: translate(-50%, 20px); opacity: 0; padding: 10px 16px; border-radius: 14px; background: var(--card-3); font-size: 13px; font-weight: 600; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 10px 28px rgba(0,0,0,.5); white-space: nowrap; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* Seiten und Abschnitte */
.page { display: flex; flex-direction: column; gap: 22px; padding-top: 14px; }
.page[hidden] { display: none; }
.cols { display: grid; gap: 22px; align-items: start; }
.cols > * { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.sec { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 2px; }
.sec-h h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.sec-h span { font-size: 12.5px; color: var(--faint); }
.dayhead { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; letter-spacing: 0.01em; padding: 0 2px; }
.dayhead small { display: block; font-family: var(--sans); font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--muted); margin-top: 6px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.dlabel { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 6px; font-size: 13px; font-weight: 700; }
.dlabel span { font-weight: 500; color: var(--muted); }
.empty { padding: 16px 14px; color: var(--muted); font-size: 14px; }
.empty b { color: var(--fg); font-weight: 600; }
.note { font-size: 12.5px; color: var(--faint); padding: 0 2px; margin: 0; }

/* Terminzeile */
.ev { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 11px 14px; border-top: 1px solid var(--line); position: relative; }
.card > .ev:first-child, .dlabel + .ev { border-top: 0; }
.ev:active { background: var(--card-2); }
@media (hover: hover) { .ev:hover { background: var(--card-2); } }
.ev:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
.ev.fcb::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--fcb); }
.ev-t { font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1; font-variant-numeric: tabular-nums; }
.ev-t small { display: block; font-family: var(--sans); font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 3px; letter-spacing: 0.02em; }
.ev-t.open { font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1.25; }
.ev-m { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.ev-m b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-m .meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.ev-m .meta > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ev-m .meta svg { width: 13px; height: 13px; flex: none; opacity: 0.8; }
.ev.fcb .meta .w { color: var(--fcb-ink); }
.ev-r { display: flex; align-items: center; gap: 8px; }
.score { font-family: var(--display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; background: var(--card-3); color: var(--fg); white-space: nowrap; }
.pill.live { background: rgba(255, 75, 92, 0.16); color: #FF8A96; }
.pill.live::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: pulse 1.4s ease-in-out infinite; }
.pill.fcb { background: var(--fcb); color: #fff; }
.pill.dim { background: transparent; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line-2); }
.ev.done .ev-t, .ev.done .ev-m b { color: var(--muted); }
.chev { width: 16px; height: 16px; color: var(--faint); flex: none; transition: transform .2s; }
.ev.grp .ev-t { font-family: var(--sans); font-size: 13px; font-weight: 700; color: var(--muted); }
.ev.grp[aria-expanded="true"] .chev { transform: rotate(180deg); }

/* Bayern-Karte */
.hero-fcb { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; border-radius: 20px; padding: 16px 16px 15px; position: relative; overflow: hidden;
  background: radial-gradient(120% 140% at 100% 0%, rgba(220, 43, 58, 0.22), transparent 60%), var(--card); border: 1px solid rgba(220, 43, 58, 0.30); }
.hero-fcb:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.hf-top { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fcb-ink); }
.hf-top span:last-child { color: var(--muted); letter-spacing: 0.04em; }
.hf-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: end; margin-top: 12px; }
.hf-teams { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.hf-teams b { font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 10px; }
.hf-teams b i { font-style: normal; flex: none; width: 34px; height: 22px; border-radius: 6px; background: var(--card-3); font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.hf-teams b i.r { background: var(--fcb); color: #fff; }
.hf-when { text-align: right; }
.hf-when strong { display: block; font-family: var(--display); font-weight: 800; font-size: 36px; line-height: 0.9; font-variant-numeric: tabular-nums; }
.hf-when small { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-top: 6px; white-space: nowrap; }

/* Sport-Kopfbild */
.shero { position: relative; height: 168px; border-radius: 22px; overflow: hidden; background: var(--hero); border: 1px solid var(--line); }
.shero svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.shero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0, 0, 0, 0.45)); }
.shero-t { position: absolute; left: 18px; right: 18px; bottom: 15px; z-index: 1; }
.shero-t small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--tint); }
.shero-t h2 { margin: 2px 0 0; font-family: var(--display); font-weight: 900; font-size: 46px; line-height: 0.92; text-transform: uppercase; letter-spacing: 0.01em; }
.shero-t p { margin: 6px 0 0; font-size: 13px; color: var(--tint); }

/* F1-Wochenenden, Turniere */
.wk { padding: 14px 14px 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.wk b { font-family: var(--display); font-weight: 800; font-size: 23px; line-height: 1; text-transform: uppercase; }
.wk span { font-size: 12.5px; color: var(--muted); text-align: right; }
.card.past { opacity: 0.55; }

/* Kalender */
.cal { overflow: hidden; }
.cal-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 12px 10px 16px; }
.cal-h h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; text-transform: uppercase; }
.cal-nav { display: flex; gap: 6px; }
.ibtn { width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--card-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.ibtn svg { width: 18px; height: 18px; }
.ibtn[disabled] { opacity: 0.3; cursor: default; }
.tbtn { height: 40px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--card-2); cursor: pointer; font-size: 13px; font-weight: 700; }
.dows { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 0 6px; }
.dows span { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--faint); padding: 4px 0 6px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; padding: 0 6px 8px; }
.day { all: unset; box-sizing: border-box; cursor: pointer; min-height: 54px; border-radius: 12px; padding: 6px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; position: relative; }
.day:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
@media (hover: hover) { .day:hover { background: var(--card-2); } }
.dn { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.day.out .dn { color: var(--faint); }
.day.today .dn { box-shadow: inset 0 0 0 1.5px var(--fg); }
.day.sel .dn { background: var(--fg); color: #0A0C10; font-weight: 700; }
.dots { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; max-width: 100%; min-height: 6px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: #B7C0CD; display: block; }
.dots i.fcb { background: var(--fcb); }
.dots i.ser { width: 12px; border-radius: 3px; background: var(--faint); }
.dchips { display: none; }

/* Tabellen und Spieltage */
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--card-2); align-self: flex-start; }
.seg button { border: 0; background: transparent; height: 32px; padding: 0 14px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card-3); color: var(--fg); }
.tbl { display: grid; grid-template-columns: 30px minmax(0, 1fr) repeat(4, 30px) 36px; font-variant-numeric: tabular-nums; font-size: 14px; }
.tbl > * { padding: 9px 3px; border-top: 1px solid var(--line); display: flex; align-items: center; min-width: 0; }
.tbl > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.tbl .th { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--faint); border-top: 0; }
.tbl .n { justify-content: flex-end; }
.tbl .pts { font-weight: 700; }
.tbl .rk { color: var(--muted); padding-left: 12px; }
.tbl .hl { background: rgba(255, 255, 255, 0.04); font-weight: 600; }
.tbl .hl.rk { box-shadow: inset 3px 0 0 rgba(255, 255, 255, 0.5); color: var(--fg); }
.tbl .fcbrow { background: var(--fcb-soft); }
.tbl .fcbrow.rk { box-shadow: inset 3px 0 0 var(--fcb); }
.tbl .last { padding-right: 12px; }
.rd { display: flex; align-items: center; gap: 6px; padding: 12px 12px 4px; flex-wrap: wrap; }
.rd h3 { margin: 0 6px 0 4px; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; text-transform: uppercase; flex: 1; min-width: 7ch; }
.rd select { height: 40px; max-width: 100%; padding: 0 10px; border: 0; border-radius: 12px; background: var(--card-2); color: var(--fg); font: inherit; font-size: 16px; font-weight: 600; flex-basis: 100%; }
.rd-sub { font-size: 12.5px; color: var(--muted); padding: 2px 14px 6px; margin: 0; }
.mx { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); position: relative; }
.mx .mt { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; color: var(--muted); }
.mx .mm { min-width: 0; }
.mx .mm b { display: block; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mx .mm small { display: block; font-size: 11.5px; color: var(--muted); }
.mx .ms { font-family: var(--display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.mx.hl { background: rgba(255, 255, 255, 0.035); }
.mx.fcb { background: var(--fcb-soft); }
.mx.fcb::before, .mx.hl::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: rgba(255,255,255,.5); }
.mx.fcb::before { background: var(--fcb); }
.mx.de .mm small { color: var(--faint); }
.md { padding: 12px 14px 6px; font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; border-top: 1px solid var(--line); }
.md small { font-weight: 500; color: var(--muted); }
.md.first { border-top: 0; }

/* Detailansicht */
.sheet-bg { position: fixed; inset: 0; z-index: 80; background: rgba(0, 0, 0, 0.55); opacity: 0; transition: opacity .2s; }
.sheet-bg.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 81; margin: 0 auto; max-width: 560px; max-height: 88vh; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--card); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 8px 18px calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateY(105%); transition: transform .26s cubic-bezier(.2,.8,.2,1); }
.sheet.on { transform: translateY(0); }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 2px auto 10px; }
.sh-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sh-top small { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.x { width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--card-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.x svg { width: 16px; height: 16px; }
.duel { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; margin: 16px 0 6px; text-align: center; }
.side { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.side i { font-style: normal; width: 46px; height: 46px; border-radius: 50%; background: var(--card-3); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; letter-spacing: 0.03em; color: var(--muted); }
.side i.r { background: var(--fcb); color: #fff; }
.side b { font-size: 15px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.side span { font-size: 12px; color: var(--muted); }
.mid strong { display: block; font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.mid small { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
.solo { margin: 14px 0 4px; }
.solo h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 0.98; text-transform: uppercase; }
.solo p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.status { text-align: center; margin: 4px 0 14px; }
.info { background: var(--card-2); border-radius: 16px; overflow: hidden; margin-top: 12px; }
.info div { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); font-size: 14px; align-items: start; }
.info div:first-child { border-top: 0; }
.info svg { width: 18px; height: 18px; color: var(--muted); margin-top: 1px; }
.acts { display: flex; gap: 8px; margin-top: 14px; }

      if (e.note) info += '<div>' + svg(I.info) + '<span>' + esc(e.note) + '</span></div>';
      html += '<div class="info">' + info + '</div>';
      var lk = e.sport === 'fussball' ? (e.comp === 'DFB-Pokal' ? 'pk' : LEAGUE[e.comp]) : null;
      html += '<div class="acts">' + (done || window.SB_ART ? '' : '<button class="btn pri" type="button" data-ics="ev:' + esc(e.id) + '">' + svg(I.plus) + 'In Kalender</button>') +
        (lk && (fixtures[lk] || (data.tables || []).some(function (t) { return t.key === lk; })) ? '<button class="btn" type="button" data-league="' + lk + '">' + svg(I.list) + (lk === 'pk' ? 'Pokalrunde' : 'Tabelle') + '</button>' : '') + '</div>';
    } else {
      var s = series.filter(function (x) { return x.id === id; })[0]; if (!s) return;
      var running = s.from <= c.today && c.today <= s.to;
      html += '<div class="sh-top"><small>' + esc(SNAME[s.sport] + ' · ' + String(s.tour || '').replace(', Vorschlag', '')) + '</small><button class="x" type="button" data-close="1" aria-label="Schließen">' + svg(I.x) + '</button></div>' +
        '<div class="solo"><h3>' + esc(s.name) + '</h3><p>' + esc(dayMonth.format(keyDate(s.from)) + ' bis ' + dayMonth.format(keyDate(s.to))) + '</p></div><div class="status" style="text-align:left">' +
        (running ? '<span class="pill live">Läuft gerade</span>' : s.to < c.today ? '<span class="pill dim">Vorbei</span>' : '<span class="pill dim">' + esc(diff(c.today, s.from) === 1 ? 'startet morgen' : 'startet in ' + diff(c.today, s.from) + ' Tagen') + '</span>') + '</div>';
      var inf = (s.place ? '<div>' + svg(I.pin) + '<span>' + esc(s.place) + '</span></div>' : '') + '<div>' + svg(I.trophy) + '<span>' + esc(s.tour) + '</span></div>' + (s.note ? '<div>' + svg(I.info) + '<span>' + esc(s.note) + '</span></div>' : '');
      html += '<div class="info">' + inf + '</div>' + (s.to < c.today || window.SB_ART ? '' : '<div class="acts"><button class="btn pri" type="button" data-ics="ser:' + esc(s.id) + '">' + svg(I.plus) + 'In Kalender</button></div>');
    }
    var host = document.getElementById('sheetHost');
    host.innerHTML = '<div class="sheet-bg" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Details"><div class="grab"></div>' + html + '</div>';
    state.sheet = { kind: kind, id: id };
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(function () { requestAnimationFrame(function () { host.querySelector('.sheet-bg').classList.add('on'); host.querySelector('.sheet').classList.add('on'); var x = host.querySelector('.x'); if (x) x.focus({ preventScroll: true }); }); });
  }
  function closeSheet() {
    var host = document.getElementById('sheetHost'), sh = host.querySelector('.sheet');
    if (!sh) return;
    state.sheet = null; document.body.style.overflow = '';
    host.querySelector('.sheet-bg').classList.remove('on'); sh.classList.remove('on');
    setTimeout(function () { if (!state.sheet) host.innerHTML = ''; }, 260);
  }

  // ---------- Kalenderdatei ----------
  function icsDate(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
  function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
  function makeIcs(kind, id) {
    var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Sport Board//DE', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT', 'UID:' + id + '@sport-board', 'DTSTAMP:' + icsDate(new Date())], name;
    if (kind === 'ev') {
      var e = events.filter(function (x) { return x.id === id; })[0];
      name = e.sport === 'f1' ? e.home + ' – ' + e.away : e.home + ' – ' + e.away;
      if (e.timed) L.push('DTSTART:' + icsDate(e.t0), 'DTEND:' + icsDate(e.t1));
      else L.push('DTSTART;VALUE=DATE:' + e.key.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + addDays(e.key, 1).replace(/-/g, ''));
      L.push('SUMMARY:' + icsEsc(name), 'DESCRIPTION:' + icsEsc([SNAME[e.sport] + ' · ' + e.comp, e.note].filter(Boolean).join('\n')));
      if (e.place) L.push('LOCATION:' + icsEsc(e.place));
      if (e.timed) L.push('BEGIN:VALARM', 'TRIGGER:-PT30M', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(name), 'END:VALARM');
    } else {
      var s = series.filter(function (x) { return x.id === id; })[0];
      name = s.name;
      L.push('DTSTART;VALUE=DATE:' + s.from.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + addDays(s.to, 1).replace(/-/g, ''), 'SUMMARY:' + icsEsc(s.name), 'DESCRIPTION:' + icsEsc(SNAME[s.sport] + ' · ' + s.tour));
      if (s.place) L.push('LOCATION:' + icsEsc(s.place));
    }
    L.push('END:VEVENT', 'END:VCALENDAR');
    var a = document.createElement('a');
    a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(L.join('\r\n'));
    a.download = name.replace(/[^\wäöüÄÖÜß\- ]+/g, '').slice(0, 60) + '.ics';
    document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------- Kopf, Leisten, Badge ----------
  function renderBar(c) {
    document.getElementById('title').textContent = state.page === 'home' ? 'Übersicht' : state.page === 'cal' ? 'Kalender' : 'Sport';
    var as = new Date(data.asOf), ak = dayFmt.format(as), old = (c.now - as) > 26 * 3600000;
    var st = document.getElementById('stamp');
    st.classList.toggle('old', old);
    document.getElementById('stampT').textContent = 'Stand ' + (ak === c.today ? hhmm(as) : dm(ak));
    var ch = document.getElementById('chips');
    if (state.page === 'home') { ch.hidden = true; ch.innerHTML = ''; return; }
    ch.hidden = false;
    var keys = state.page === 'cal' ? ['alle'].concat(SORDER) : SORDER, cur = state.page === 'cal' ? state.calSport : state.sport;
    ch.innerHTML = keys.map(function (k) { return '<button class="chip" type="button" data-sport="' + k + '" aria-pressed="' + (k === cur) + '">' + (k === 'alle' ? 'Alle' : svg(ICO[k]) + esc(SPORTS[k])) + '</button>'; }).join('');
    var on = ch.querySelector('[aria-pressed="true"]');
    if (on && ch.scrollWidth > ch.clientWidth) ch.scrollLeft = Math.max(0, on.offsetLeft - (ch.clientWidth - on.offsetWidth) / 2);
  }
  function renderTabbar() {
    var P = [['home', 'Übersicht', I.home], ['cal', 'Kalender', I.cal], ['sport', 'Sport', I.sport]];
    document.getElementById('tabbar').innerHTML = P.map(function (p) { return '<button type="button" data-page="' + p[0] + '" aria-pressed="' + (state.page === p[0]) + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + p[2] + '</svg><span>' + p[1] + '</span></button>'; }).join('');
  }
  var standalone = !!(window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
  function badgeOffer() {
    if (!standalone || !('setAppBadge' in navigator) || !window.Notification || Notification.permission !== 'default') return '';
    return '<button class="more-btn" type="button" data-badge="1">Zahl der heutigen Termine am App-Icon zeigen</button>';
  }
  function updateBadge(c) {
    if (!('setAppBadge' in navigator)) return;
    try {
      var n = events.filter(function (e) { return e.key === c.today && !isDone(e, c.now, c.today); }).length;
      (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(function () {});
    } catch (e) {}
  }

  function render() {
    var c = nowInfo();
    if (!state.sel) state.sel = c.today;
    if (!state.month) { state.month = ymOf(c.today); if (state.month < minYM) state.month = minYM; if (state.month > maxYM) state.month = maxYM; }
    document.body.className = state.page === 'sport' ? 'th-' + state.sport : '';
    renderBar(c); renderTabbar();
    ['home', 'cal', 'sport'].forEach(function (p) { document.getElementById('p-' + p).hidden = state.page !== p; });
    if (state.page === 'home') renderHome(c);
    else if (state.page === 'cal') renderCal(c);
    else renderSport(c);
    updateBadge(c);
  }
  function setPage(p) { state.page = p; persist(); render(); window.scrollTo(0, 0); }

  // ---------- Aktualisieren ----------
  var toastT;
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 2400); }
  var lastCheck = Date.now(), busy = false;
  function refresh(manual) {
    if (window.SB_ART) { if (manual) toast('Das Board aktualisiert sich jeden Morgen um 10 Uhr'); return; }
    if (busy || !/^https?:$/.test(location.protocol)) { if (manual) toast('Aktualisieren geht nur in der App'); return; }
    if (navigator.onLine === false) { if (manual) toast('Offline, zeige gespeicherten Stand'); return; }
    busy = true; lastCheck = Date.now();
    var st = document.getElementById('stamp'); st.classList.add('busy');
    fetch(location.pathname + '?fresh=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (html) {
      var vm = html.match(/<meta name="app-version" content="([^"]+)">/), cur = document.querySelector('meta[name="app-version"]');
      if (vm && cur && vm[1] !== cur.getAttribute('content')) { location.reload(); return; }
      var m = html.match(RE_DATA); if (!m) throw new Error('nodata');
      var nd = JSON.parse(m[1]);
      if (new Date(nd.asOf) > new Date(data.asOf)) { ingest(nd); render(); toast('Neue Daten geladen'); }
      else if (manual) { render(); toast('Alles aktuell'); }
    }).catch(function () { if (manual) toast('Offline, zeige gespeicherten Stand'); })
      .then(function () { busy = false; st.classList.remove('busy'); });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { if (!state.sheet) render(); if (Date.now() - lastCheck > 120000) refresh(false); } });
  window.addEventListener('pageshow', function (ev) { if (ev.persisted) { render(); refresh(false); } });

  var ptr = document.getElementById('ptr'), y0 = null, pulled = 0;
  window.addEventListener('touchstart', function (ev) { y0 = (window.scrollY <= 0 && !state.sheet && ev.touches.length === 1) ? ev.touches[0].clientY : null; pulled = 0; }, { passive: true });
  window.addEventListener('touchmove', function (ev) {
    if (y0 === null) return;
    pulled = ev.touches[0].clientY - y0;
    if (pulled <= 0) { ptr.style.transform = ''; return; }
    var p = Math.min(pulled, 110);
    ptr.textContent = pulled > 80 ? 'Loslassen zum Aktualisieren' : 'Zum Aktualisieren ziehen';
    ptr.style.transform = 'translate(-50%, ' + (p - 70) + 'px)';
  }, { passive: true });
  window.addEventListener('touchend', function () { if (y0 !== null && pulled > 80) refresh(true); y0 = null; pulled = 0; ptr.style.transform = ''; }, { passive: true });

  // ---------- Bedienung ----------
  document.addEventListener('click', function (ev) {
    var t = ev.target, b;
    if ((b = t.closest('[data-close]'))) { closeSheet(); return; }
    if ((b = t.closest('[data-ics]'))) { var p = b.getAttribute('data-ics').split(':'); makeIcs(p[0], p.slice(1).join(':')); return; }
    if ((b = t.closest('[data-league]'))) { closeSheet(); state.tbl = b.getAttribute('data-league'); state.view = 'tab'; if (state.tbl === 'pk') state.view = 'spt'; state.sport = 'fussball'; setPage('sport'); setTimeout(function () { var el = document.getElementById('tbl'); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 60); return; }
    if ((b = t.closest('[data-ev]'))) { openSheet('ev', b.getAttribute('data-ev')); return; }
    if ((b = t.closest('[data-ser]'))) { openSheet('ser', b.getAttribute('data-ser')); return; }
    if ((b = t.closest('[data-grp]'))) { var id = b.getAttribute('data-grp'); state.open[id] = !state.open[id]; render(); return; }
    if ((b = t.closest('[data-page]'))) { var pg = b.getAttribute('data-page'); if (pg === state.page) window.scrollTo({ top: 0, behavior: 'smooth' }); else setPage(pg); return; }
    if ((b = t.closest('[data-go]'))) { setPage(b.getAttribute('data-go')); return; }
    if ((b = t.closest('[data-sport]'))) { var s = b.getAttribute('data-sport'); if (state.page === 'cal') state.calSport = s; else state.sport = s; persist(); render(); if (state.page === 'sport') window.scrollTo(0, 0); return; }
    if ((b = t.closest('[data-k]'))) { state.sel = b.getAttribute('data-k'); render(); var f = document.querySelector('.day.sel'); if (f) f.focus({ preventScroll: true }); if (window.innerWidth < 900) { var d = document.querySelector('#p-cal .cols > div:last-child'); if (d) d.scrollIntoView({ block: 'start', behavior: 'smooth' }); } return; }
    if ((b = t.closest('[data-cal]'))) {
      var v = b.getAttribute('data-cal');
      if (v === 'today') { var c = nowInfo(); state.sel = c.today; state.month = ymOf(c.today); }
      else { var pp = state.month.split('-'), ym = keyOfUTC(mk(+pp[0], +pp[1] + (+v), 1)).slice(0, 7); if (ym >= minYM && ym <= maxYM) state.month = ym; }
      render(); return;
    }
    if ((b = t.closest('[data-tbl]'))) { state.tbl = b.getAttribute('data-tbl'); persist(); rerenderTbl(); return; }
    if ((b = t.closest('[data-view]'))) { state.view = b.getAttribute('data-view'); persist(); rerenderTbl(); return; }
    if ((b = t.closest('[data-rd]'))) {
      var fx = fixtures[state.tbl]; if (!fx) return;
      var cc = nowInfo(), rv = b.getAttribute('data-rd'), n = state.rd[state.tbl] || curRound(fx, cc.today);
      n = rv === 'cur' ? curRound(fx, cc.today) : n + (+rv);
      state.rd[state.tbl] = Math.max(1, Math.min(fx.total, n)); rerenderTbl(); return;
    }
    if ((b = t.closest('[data-badge]'))) { Notification.requestPermission().then(function () { render(); }); return; }
    if (t.closest('#stamp')) { refresh(true); return; }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t && t.getAttribute && t.getAttribute('data-rdsel')) { var fx = fixtures[state.tbl]; if (!fx) return; state.rd[state.tbl] = Math.max(1, Math.min(fx.total, +t.value || 1)); rerenderTbl(); }
  });
  function rerenderTbl() {
    var el = document.getElementById('tbl'); if (!el) return render();
    el.innerHTML = tablesHtml(nowInfo());
    var on = el.querySelector('.chips [aria-pressed="true"]'); if (on) { var bar = on.parentNode; bar.scrollLeft = Math.max(0, on.offsetLeft - (bar.clientWidth - on.offsetWidth) / 2); }
  }
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && state.sheet) closeSheet(); });
  // Detailansicht nach unten wegwischen
  var sy = null;
  document.addEventListener('touchstart', function (ev) { var sh = ev.target.closest && ev.target.closest('.sheet'); sy = sh && sh.scrollTop <= 0 ? ev.touches[0].clientY : null; }, { passive: true });
  document.addEventListener('touchend', function (ev) { if (sy !== null && ev.changedTouches[0].clientY - sy > 90) closeSheet(); sy = null; }, { passive: true });
  var bar = document.getElementById('bar');
  window.addEventListener('scroll', function () { bar.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });

  render();
  setInterval(function () { if (!state.sheet && !document.hidden) render(); }, 60000);
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
