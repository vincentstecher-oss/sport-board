<style>
/* Dunkles Design mit Themes pro Sportart. Der Hintergrund wechselt mit dem gewaehlten Sport-Tab. */
:root {
  color-scheme: dark;
  --bg: #080B10; --surface: rgba(16, 21, 30, 0.66); --surface-2: rgba(255, 255, 255, 0.06); --surface-solid: #121821;
  --line: rgba(255, 255, 255, 0.09); --line-strong: rgba(255, 255, 255, 0.18);
  --text: #F3F5F9; --muted: #9DAABF; --faint: #66748A;
  --fcb: #D8213F; --fcb-on: #FFFFFF; --live: #FF4B5C; --on-sport: #07090D;
  --fb: #8BAAD4; --te: #BFCB86; --go: #7FBF9A; --bo: #D49580; --mm: #A99BD0; --f1: #7FC4BD;
  --display: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', Impact, sans-serif;
  --sans: 'Archivo', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --r: 18px; --th: #C9D2E0;
  --art: radial-gradient(ellipse 60% 30% at 20% 0%, rgba(220,230,245,0.07), transparent 70%), linear-gradient(180deg, #0a0d12, #080B10);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
}
body::before { content: ''; position: fixed; inset: 0; z-index: -2; pointer-events: none; background: var(--art); transition: opacity .3s; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.s-fussball { --c: var(--fb); } .s-tennis { --c: var(--te); } .s-golf { --c: var(--go); } .s-boxen { --c: var(--bo); } .s-mma { --c: var(--mm); } .s-f1 { --c: var(--f1); } .s-alle { --c: #F3F5F9; }

/* Themes */
body.th-fussball { --th: #B7C4D6; --art: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%201000%201600%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%0A%3Cg%20fill%3D%27none%27%20stroke%3D%27rgba%28255%2C255%2C255%2C0.07%29%27%20stroke-width%3D%273%27%3E%0A%3Crect%20x%3D%2760%27%20y%3D%2760%27%20width%3D%27880%27%20height%3D%271480%27%2F%3E%3Cpath%20d%3D%27M60%20800H940%27%2F%3E%3Ccircle%20cx%3D%27500%27%20cy%3D%27800%27%20r%3D%27150%27%2F%3E%0A%3Crect%20x%3D%27250%27%20y%3D%2760%27%20width%3D%27500%27%20height%3D%27230%27%2F%3E%3Crect%20x%3D%27250%27%20y%3D%271310%27%20width%3D%27500%27%20height%3D%27230%27%2F%3E%0A%3Crect%20x%3D%27370%27%20y%3D%2760%27%20width%3D%27260%27%20height%3D%2795%27%2F%3E%3Crect%20x%3D%27370%27%20y%3D%271445%27%20width%3D%27260%27%20height%3D%2795%27%2F%3E%0A%3Cpath%20d%3D%27M390%20290a110%20110%200%200%200%20220%200%27%2F%3E%3Cpath%20d%3D%27M390%201310a110%20110%200%200%201%20220%200%27%2F%3E%3C%2Fg%3E%0A%3Ccircle%20cx%3D%27500%27%20cy%3D%27800%27%20r%3D%277%27%20fill%3D%27rgba%28255%2C255%2C255%2C0.12%29%27%2F%3E%3C%2Fsvg%3E") 50% 0/cover no-repeat, radial-gradient(ellipse 45% 26% at 10% 0%, rgba(210,225,245,0.10), transparent 70%), radial-gradient(ellipse 45% 26% at 90% 0%, rgba(210,225,245,0.08), transparent 70%), linear-gradient(180deg, #090d12 0%, #0a1510 55%, #0b1a12 100%); }
body.th-tennis { --th: #C9D0B0; --art: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%201000%201600%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%0A%3Cg%20fill%3D%27none%27%20stroke%3D%27rgba%28255%2C255%2C255%2C0.08%29%27%20stroke-width%3D%274%27%3E%0A%3Crect%20x%3D%27110%27%20y%3D%27120%27%20width%3D%27780%27%20height%3D%271360%27%2F%3E%3Cpath%20d%3D%27M200%20120V1480M800%20120V1480%27%2F%3E%0A%3Cpath%20d%3D%27M200%20460H800M200%201140H800%27%2F%3E%3Cpath%20d%3D%27M500%20460V1140%27%2F%3E%3Cpath%20d%3D%27M500%20120v28M500%201452v28%27%2F%3E%3C%2Fg%3E%0A%3Cpath%20d%3D%27M80%20800H920%27%20stroke%3D%27rgba%28255%2C255%2C255%2C0.14%29%27%20stroke-width%3D%276%27%20stroke-dasharray%3D%274%208%27%2F%3E%3C%2Fsvg%3E") 50% 0/cover no-repeat, radial-gradient(ellipse 50% 26% at 100% 0%, rgba(220,235,160,0.07), transparent 70%), linear-gradient(180deg, #0a1116, #0c1a20 55%, #0d1f26); }
body.th-golf { --th: #C8CDB8; --art: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20120%20200%27%3E%0A%3Cg%20fill%3D%27none%27%20stroke%3D%27rgba%28255%2C255%2C255%2C0.20%29%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%3E%0A%3Cpath%20d%3D%27M30%2012V176%27%2F%3E%3Cellipse%20cx%3D%2730%27%20cy%3D%27178%27%20rx%3D%2728%27%20ry%3D%277%27%2F%3E%3C%2Fg%3E%0A%3Cpath%20d%3D%27M32%2014L100%2038L32%2062Z%27%20fill%3D%27rgba%28255%2C255%2C255%2C0.14%29%27%2F%3E%3C%2Fsvg%3E") 94% 96%/120px no-repeat, radial-gradient(ellipse 60% 26% at 20% 0%, rgba(235,235,200,0.07), transparent 70%), repeating-linear-gradient(90deg, rgba(255,255,255,0.016) 0 70px, transparent 70px 140px), linear-gradient(180deg, #090f0b, #0c1710 60%, #0d1b12); }
body.th-boxen { --th: #D2B8B0; --art: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%201000%20300%27%20preserveAspectRatio%3D%27none%27%3E%0A%3Cg%20fill%3D%27none%27%20stroke-linecap%3D%27round%27%3E%0A%3Cpath%20d%3D%27M-10%2070Q500%20100%201010%2070%27%20stroke%3D%27rgba%28255%2C255%2C255%2C0.20%29%27%20stroke-width%3D%277%27%2F%3E%0A%3Cpath%20d%3D%27M-10%20140Q500%20170%201010%20140%27%20stroke%3D%27rgba%28255%2C255%2C255%2C0.20%29%27%20stroke-width%3D%277%27%2F%3E%0A%3Cpath%20d%3D%27M-10%20210Q500%20240%201010%20210%27%20stroke%3D%27rgba%28255%2C255%2C255%2C0.20%29%27%20stroke-width%3D%277%27%2F%3E%3C%2Fg%3E%0A%3Cg%20fill%3D%27rgba%28255%2C255%2C255%2C0.10%29%27%3E%3Crect%20x%3D%270%27%20y%3D%2730%27%20width%3D%2726%27%20height%3D%27270%27%20rx%3D%276%27%2F%3E%3Crect%20x%3D%27974%27%20y%3D%2730%27%20width%3D%2726%27%20height%3D%27270%27%20rx%3D%276%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") 50% 100%/100% 280px no-repeat, radial-gradient(ellipse 55% 38% at 50% -8%, rgba(255,200,170,0.13), transparent 72%), linear-gradient(180deg, #0d0809, #0a0607); }
body.th-mma { --th: #BDB6D2; --art: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%201000%201000%27%3E%0A%3Cg%20fill%3D%27none%27%20stroke%3D%27rgba%28255%2C255%2C255%2C0.10%29%27%20stroke-width%3D%275%27%20stroke-linejoin%3D%27round%27%3E%0A%3Cpath%20d%3D%27M293%2040H707L960%20293V707L707%20960H293L40%20707V293Z%27%2F%3E%0A%3Cpath%20d%3D%27M330%20150H670L850%20330V670L670%20850H330L150%20670V330Z%27%20stroke-width%3D%273%27%20stroke%3D%27rgba%28255%2C255%2C255%2C0.06%29%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") 50% 36%/min(1000px, 135vw) no-repeat, url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2730%27%20height%3D%2730%27%20viewBox%3D%270%200%2030%2030%27%3E%0A%3Cpath%20d%3D%27M0%2015L15%200L30%2015L15%2030Z%27%20fill%3D%27none%27%20stroke%3D%27rgba%28255%2C255%2C255%2C0.04%29%27%20stroke-width%3D%271.2%27%2F%3E%3C%2Fsvg%3E") 0 0/30px 30px repeat, radial-gradient(ellipse 60% 34% at 50% 25%, rgba(200,190,235,0.09), transparent 72%), linear-gradient(180deg, #0f0c16, #09070d); }
body.th-f1 { --th: #B4CCCB; --art: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20600%20400%27%3E%0A%3Cpath%20d%3D%27M60%20300C60%20220%20160%20230%20200%20180C240%20130%20220%2070%20300%2070C380%2070%20380%20150%20440%20170C520%20195%20560%20250%20520%20320C490%20370%20380%20350%20330%20330C270%20305%20230%20340%20170%20350C100%20360%2060%20340%2060%20300Z%27%0A%20fill%3D%27none%27%20stroke%3D%27rgba%28255%2C255%2C255%2C0.10%29%27%20stroke-width%3D%2714%27%20stroke-linejoin%3D%27round%27%2F%3E%0A%3Cpath%20d%3D%27M60%20300C60%20220%20160%20230%20200%20180C240%20130%20220%2070%20300%2070C380%2070%20380%20150%20440%20170C520%20195%20560%20250%20520%20320C490%20370%20380%20350%20330%20330C270%20305%20230%20340%20170%20350C100%20360%2060%20340%2060%20300Z%27%0A%20fill%3D%27none%27%20stroke%3D%27rgba%28255%2C255%2C255%2C0.10%29%27%20stroke-width%3D%272%27%20stroke-dasharray%3D%2710%2012%27%2F%3E%3C%2Fsvg%3E") 96% 30%/min(620px, 110vw) no-repeat, url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2710%27%20height%3D%2710%27%20viewBox%3D%270%200%2010%2010%27%3E%0A%3Crect%20width%3D%275%27%20height%3D%275%27%20fill%3D%27rgba%28255%2C255%2C255%2C0.035%29%27%2F%3E%3Crect%20x%3D%275%27%20y%3D%275%27%20width%3D%275%27%20height%3D%275%27%20fill%3D%27rgba%28255%2C255%2C255%2C0.035%29%27%2F%3E%0A%3Crect%20x%3D%275%27%20width%3D%275%27%20height%3D%275%27%20fill%3D%27rgba%280%2C0%2C0%2C0.18%29%27%2F%3E%3Crect%20y%3D%275%27%20width%3D%275%27%20height%3D%275%27%20fill%3D%27rgba%280%2C0%2C0%2C0.18%29%27%2F%3E%3C%2Fsvg%3E") 0 0/10px 10px repeat, radial-gradient(ellipse 55% 26% at 100% 0%, rgba(190,235,230,0.09), transparent 70%), linear-gradient(180deg, #090b0e, #06080a); }
body.th-f1::after { content: ''; position: fixed; top: 0; left: 0; right: 0; height: 6px; z-index: 40; pointer-events: none; background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2724%27%20height%3D%2712%27%20viewBox%3D%270%200%2024%2012%27%3E%0A%3Crect%20width%3D%276%27%20height%3D%276%27%20fill%3D%27white%27%2F%3E%3Crect%20x%3D%2712%27%20width%3D%276%27%20height%3D%276%27%20fill%3D%27white%27%2F%3E%0A%3Crect%20x%3D%276%27%20y%3D%276%27%20width%3D%276%27%20height%3D%276%27%20fill%3D%27white%27%2F%3E%3Crect%20x%3D%2718%27%20y%3D%276%27%20width%3D%276%27%20height%3D%276%27%20fill%3D%27white%27%2F%3E%3C%2Fsvg%3E") 0 0/16px 8px repeat-x; opacity: 0.28; }

.wrap { max-width: 1080px; margin: 0 auto; padding-block: max(16px, env(safe-area-inset-top, 0px)) calc(104px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }

/* Kopf */
.top { position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 20px; padding: 10px 2px 2px; overflow: hidden; }
.brand { display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative; z-index: 1; }
h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(30px, 6.4vw, 54px); line-height: 0.95; letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance; }
.stripe { display: none; }
.stripe i { flex: 1; border-radius: 3px; background: var(--c); }
body:not(.th-alle) .stripe i { background: var(--th); }
.today { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; font-family: var(--display); text-transform: uppercase; position: relative; z-index: 1; }
.tdow, .tdate { font-size: 26px; font-weight: 800; letter-spacing: 0.02em; }
.tdate { color: var(--muted); font-variant-numeric: tabular-nums; }
.stamp { font-family: var(--sans); text-transform: none; font-size: 11.5px; color: var(--muted); flex-basis: 100%; }
.wm { display: none; position: absolute; right: -6px; top: -14px; font-size: 104px; line-height: 1; opacity: 0.16; filter: saturate(0.9); pointer-events: none; user-select: none; transform: rotate(-12deg); }

/* Sportwahl */
.sportnav { position: sticky; top: max(6px, env(safe-area-inset-top, 0px)); z-index: 30; padding: 6px; border-radius: 999px; background: rgba(12, 16, 23, 0.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line); box-shadow: 0 8px 26px rgba(0, 0, 0, 0.4); }
.filters { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; height: 38px; padding: 0 15px 0 11px; border: 1px solid transparent; border-radius: 999px; background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13.5px; color: var(--muted); white-space: nowrap; transition: background .15s, color .15s; }
.fchip .em { font-size: 16px; line-height: 1; filter: grayscale(1); opacity: 0.75; }
.fchip[aria-pressed="true"] .em { opacity: 1; }
.fchip:hover { background: var(--surface-2); color: var(--text); }
.fchip[aria-pressed="true"] { background: var(--text); color: #0A0D12; }

/* Karten */
.view { display: flex; flex-direction: column; gap: 14px; }
.view[hidden] { display: none; }
.panel, .cal-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.38); }
.panel { padding: 16px 16px 14px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.ph { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 12px; }
h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; text-transform: uppercase; letter-spacing: 0.02em; }
.h2-sub { font-size: 12.5px; color: var(--muted); }

.tag { display: inline-flex; align-items: center; height: 21px; padding: 0 9px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; background: var(--surface-2); color: var(--text); border-radius: 999px; }
.tag > span { display: block; }
.tag.fcb { background: var(--fcb); color: var(--fcb-on); }
.tag.live { background: var(--live); color: #fff; }

/* Termine eines Tages */
.ev { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 4px 12px; padding: 12px 0; align-items: start; }
.ev + .ev, .ser { border-top: 1px solid var(--line); }
.ev-time { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 0.95; font-variant-numeric: tabular-nums; }
.ev-time small { display: block; font-family: var(--sans); font-weight: 700; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.ev-time.open { font-size: 14px; font-family: var(--sans); font-weight: 700; line-height: 1.2; color: var(--muted); }
.ev-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; border-left: 3px solid var(--c); padding-left: 12px; border-radius: 2px; }
.ev.fcb .ev-body { border-left-color: var(--fcb); }
.ev-comp { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.ev-teams { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.05; text-transform: uppercase; overflow-wrap: anywhere; }
.ev-teams em, .nr-b em, .lr .lb em, .mx .mm em { font-style: normal; color: var(--faint); padding-inline: 0.2em; }
.ev-sub { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.ev-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.ev.done .ev-teams, .ev.done .ev-time { opacity: 0.5; }
.ser { display: flex; flex-direction: column; gap: 3px; padding: 12px 0 4px; }
.ser b { font-family: var(--display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: 0.02em; display: flex; align-items: center; gap: 8px; }
.ser b i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); display: block; flex: none; }
.empty { color: var(--muted); font-size: 13.5px; padding: 6px 0 2px; }
.empty b { color: var(--text); }

/* Als Naechstes */
.nrs { display: flex; flex-direction: column; }
.nr { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 6px 11px 0; border-top: 1px solid var(--line); }
.nr:first-child { border-top: 0; }
.nr:hover { background: var(--surface-2); }
.nr:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
.nr-d { display: flex; flex-direction: column; border-left: 4px solid var(--c); padding-left: 10px; font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.05; text-transform: uppercase; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nr.fcb .nr-d { border-left-color: var(--fcb); }
.nr-d small { font-family: var(--sans); font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: none; margin-top: 2px; }
.nr-b { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.nr-b b { font-family: var(--display); font-weight: 800; font-size: 19px; text-transform: uppercase; line-height: 1.1; overflow-wrap: anywhere; }
.nr-b small { font-size: 12px; color: var(--muted); }
.nr-c { font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--c); white-space: nowrap; }

  function serOn(k) { return series.filter(function (s) { return s.from <= k && k <= s.to && passes(s); }).sort(function (a, b) { return a.from < b.from ? -1 : a.from > b.from ? 1 : (a.id < b.id ? -1 : 1); }); }

  function timeLabel(e) { return e.timed ? (e.tent ? '~' : '') + hhmm(e.t0) : ''; }
  function fullTitle(e) { return e.comp + ': ' + e.home + ' – ' + e.away; }

  function renderHeader(c) {
    var d = keyDate(c.today);
    document.getElementById('tdow').textContent = dowShort.format(d).replace('.', '');
    document.getElementById('tdate').textContent = pad(d.getUTCDate()) + '.' + pad(d.getUTCMonth() + 1) + '.';
    document.getElementById('stamp').textContent = 'Stand ' + stampFmt.format(new Date(data.asOf)) + ' Uhr · Berliner Zeit';
  }

  function dayList(k, c, hint) {
    var list = evsOn(k), sers = serOn(k), html = '';
    list.forEach(function (e) {
      var done = isDone(e, c.now, c.today), live = isLive(e, c.now);
      var time = e.timed ? '<div class="ev-time">' + (e.tent ? '~' : '') + hhmm(e.t0) + '<small>Uhr</small></div>' : '<div class="ev-time open">Zeit<br>offen</div>';
      var tags = '';
      if (live) tags += '<span class="tag live"><span>Läuft</span></span>';
      if (e.bayern) tags += '<span class="tag fcb"><span>FC Bayern</span></span>';
      else if (e.why) tags += '<span class="tag"><span>' + esc(e.why) + '</span></span>';
      if (e.tent) tags += '<span class="tag"><span>Vorläufig</span></span>';
      var sub = [e.place, e.note].filter(Boolean).join(' · ');
      html += '<article class="ev s-' + e.sport + (e.bayern ? ' fcb' : '') + (done ? ' done' : '') + '">' + time +
        '<div class="ev-body"><div class="ev-comp">' + esc(SPORTS[e.sport]) + ' · ' + esc(e.comp) + '</div>' +
        '<div class="ev-teams">' + esc(e.home) + '<em>–</em>' + esc(e.away) + '</div>' +
        (sub ? '<div class="ev-sub">' + esc(sub) + '</div>' : '') + (tags ? '<div class="ev-tags">' + tags + '</div>' : '') + '</div></article>';
    });
    sers.forEach(function (s) {
      var rng = dayMonthShort.format(keyDate(s.from)) + ' bis ' + dayMonthShort.format(keyDate(s.to));
      html += '<div class="ser s-' + s.sport + '"><b><i></i>' + esc(s.name) + '</b><span class="ev-sub">' + esc(SPORTS[s.sport]) + ' · ' + esc(s.tour) + (s.place ? ' · ' + esc(s.place) : '') + '</span><span class="ev-sub">' + esc(rng) + (s.note ? ' · ' + esc(s.note) : '') + '</span></div>';
    });
    if (!list.length && !sers.length) {
      var nxt = null, nk = null;
      if (hint) {
        events.filter(passes).forEach(function (e) { if (e.key > k && (nk === null || e.key < nk)) nk = e.key; });
        if (nk) nxt = evsOn(nk)[0];
      }
      html += '<div class="empty">Kein Termin ' + (k === c.today ? 'heute' : 'an diesem Tag') + '.' + (nxt ? ' Als Nächstes: <b>' + esc(nxt.home) + ' – ' + esc(nxt.away) + '</b> am ' + esc(dowShort.format(keyDate(nk))) + ' ' + esc(dayMonthShort.format(keyDate(nk))) : '') + '</div>';
    }
    return html;
  }

  function renderToday(c) {
    var kd = keyDate(c.today);
    var html = '<section class="panel"><div class="ph"><h2>Heute</h2><span class="h2-sub">' + esc(dowLong.format(kd) + ', ' + dayMonth.format(kd)) + '</span></div>' + dayList(c.today, c, false) + '</section>';
    var cand = [];
    events.forEach(function (e) {
      if (!passes(e) || e.key <= c.today) return;
      var p = parseKey(e.key);
      cand.push({ ev: e, at: e.timed ? e.t0.getTime() : Date.UTC(p.y, p.m - 1, p.d, 11) });
    });
    series.forEach(function (s) {
      if (!passes(s) || s.from <= c.today) return;
      var p = parseKey(s.from);
      cand.push({ ser: s, at: Date.UTC(p.y, p.m - 1, p.d, 7) });
    });
    cand.sort(function (a, b) { return a.at - b.at; });
    var rows = cand.slice(0, 8).map(function (x) {
      var e = x.ev, s = x.ser, key = e ? e.key : s.from, sport = e ? e.sport : s.sport, d = diff(c.today, key);
      var kdd = keyDate(key);
      var left = '<b>' + esc(dowShort.format(kdd).replace('.', '') + ' ' + parseKey(key).d + '.') + '</b>';
      var small = e ? (e.timed ? (e.tent ? 'ca. ' : '') + hhmm(e.t0) : 'Zeit offen') : 'Turnier';
      var teams = e ? esc(e.home) + '<em>–</em>' + esc(e.away) : esc(s.name);
      var sub = e ? SPORTS[sport] + ' · ' + e.comp + (e.bayern ? '' : (e.why && sport === 'fussball' ? ' · ' + e.why : '')) : SPORTS[sport] + ' · ' + s.tour + (s.place ? ' · ' + s.place : '') + ' · bis ' + dayMonthShort.format(keyDate(s.to));
      var rel = d === 1 ? 'Morgen' : 'in ' + d + ' Tagen';
      return '<button class="nr s-' + sport + (e && e.bayern ? ' fcb' : '') + '" type="button" data-k="' + key + '"><span class="nr-d">' + left.replace('<b>', '').replace('</b>', '') + '<small>' + esc(small) + '</small></span>' +
        '<span class="nr-b"><b>' + teams + '</b><small>' + esc(sub) + '</small></span><span class="nr-c">' + (e && e.bayern ? 'FC Bayern · ' : '') + rel + '</span></button>';
    }).join('');
    html += '<section class="panel"><div class="ph"><h2>Als Nächstes</h2></div>' + (rows ? '<div class="nrs">' + rows + '</div><button class="more-btn" type="button" data-page="liste">Alle Termine ansehen</button>' : '<div class="empty">Keine kommenden Termine in dieser Sportart.</div>') + '</section>';
    document.getElementById('v-heute').innerHTML = html;
  }

  function renderFilters(c) {
    var counts = { alle: 0 };
    ORDER.forEach(function (s) {
      counts[s] = events.filter(function (e) { return e.sport === s && !isDone(e, c.now, c.today); }).length + series.filter(function (e) { return e.sport === s && e.to >= c.today; }).length;
      counts.alle += counts[s];
    });
    document.getElementById('filters').innerHTML = ['alle'].concat(ORDER).filter(function (s) { return s === 'alle' || counts[s]; }).map(function (s) {
      return '<button class="fchip s-' + s + '" type="button" data-sport="' + s + '" aria-pressed="' + (state.sport === s) + '"><span class="em" aria-hidden="true">' + EMO[s] + '</span><span>' + (s === 'alle' ? 'Alle' : SPORTS[s]) + '</span></button>';
    }).join('');
    var fe = document.getElementById('filters'), on = fe.querySelector('[aria-pressed="true"]');
    if (on) fe.scrollLeft = Math.max(0, on.offsetLeft - (fe.clientWidth - on.offsetWidth) / 2);
  }

  function tabAvail() { return !!(data.tables && data.tables.length) && (state.sport === 'alle' || state.sport === 'fussball'); }
  function renderTabbar(avail) {
    document.getElementById('tabbar').innerHTML = PAGES.filter(function (p) { return p.k !== 'tab' || avail; }).map(function (p) {
      return '<button type="button" data-page="' + p.k + '" aria-pressed="' + (state.page === p.k) + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + p.i + '</svg><span>' + p.n + '</span></button>';
    }).join('');
  }

  function renderCal(c) {
    var ym = state.month.split('-'), y = +ym[0], m = +ym[1];
    document.getElementById('mtitle').textContent = monthName.format(mk(y, m, 1)) + ' ' + y;
    document.getElementById('prev').disabled = state.month <= minYM;
    document.getElementById('nextm').disabled = state.month >= maxYM;
    var first = y + '-' + pad(m) + '-01';
    var dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
    var lead = dowIdx(first);
    var rows = Math.ceil((lead + dim) / 7);
    var start = addDays(first, -lead);
    var html = '';
    for (var i = 0; i < rows * 7; i++) {
      var k = addDays(start, i), out = ymOf(k) !== state.month;
      var list = evsOn(k), sers = serOn(k);
      var dow = dowIdx(k);
      var bars = sers.map(function (s) {
        var showLbl = k === s.from || dow === 0;
        var cls = 'bar s-' + s.sport + (k === s.from ? ' first' : '') + (k === s.to ? ' last' : '');
        return '<span class="' + cls + '" title="' + esc(s.name) + '">' + (showLbl ? esc(s.name) : '&nbsp;') + '</span>';
      }).join('');
      var top = list.slice().sort(function (a, b) { return (b.bayern ? 1 : 0) - (a.bayern ? 1 : 0); }).slice(0, 4);
      var shown = list.filter(function (e) { return top.indexOf(e) > -1; });
      var chips = shown.map(function (e) {
        var t = timeLabel(e);
        return '<span class="chip s-' + e.sport + (e.bayern ? ' fcb' : '') + (isDone(e, c.now, c.today) ? ' done' : '') + (isLive(e, c.now) ? ' live' : '') + '" title="' + esc(fullTitle(e)) + '">' + (t ? '<b>' + t + '</b>' : '') + esc(e.short) + '</span>';
      }).join('') + (list.length > 4 ? '<span class="more">+' + (list.length - 4) + ' weitere</span>' : '');
      var dots = list.slice(0, 6).map(function (e) { return '<i class="s-' + e.sport + (e.bayern ? ' fcb' : '') + '"></i>'; }).join('');
      var n = list.length + sers.length;
      var d = parseKey(k).d;
      var label = dayMonth.format(keyDate(k)) + (n ? ', ' + n + (n === 1 ? ' Termin' : ' Termine') : ', kein Termin');
      html += '<button class="day' + (out ? ' out' : '') + (k === c.today ? ' today' : '') + (k === state.sel ? ' sel' : '') + '" type="button" data-k="' + k + '" aria-label="' + esc(label) + '" aria-pressed="' + (k === state.sel) + '">' +
        '<span class="dn"><span>' + d + '</span></span>' +
        (bars ? '<span class="bars">' + bars + '</span>' : '') +
        '<span class="chips">' + chips + '</span><span class="dots">' + dots + '</span></button>';
    }
    document.getElementById('grid').innerHTML = html;
  }

  function renderDetail(c) {
    var k = state.sel, kd = keyDate(k);
    var rel = k === c.today ? 'Heute' : diff(c.today, k) === 1 ? 'Morgen' : diff(c.today, k) === -1 ? 'Gestern' : '';
    document.getElementById('detail').innerHTML = '<div class="ph"><h2>' + esc(dowLong.format(kd)) + ' ' + esc(dayMonth.format(kd)) + '</h2>' + (rel ? '<span class="h2-sub">' + rel + '</span>' : '') + '</div>' + dayList(k, c, true);
  }

  function renderAll(c) {
    var items = [];
    events.forEach(function (e) { if (passes(e) && !isDone(e, c.now, c.today)) items.push({ k: e.key, at: e.timed ? e.t0.getTime() : keyDate(e.key).getTime(), ev: e }); });
    series.forEach(function (s) { if (passes(s) && s.to >= c.today) { var k = s.from < c.today ? c.today : s.from; items.push({ k: k, at: keyDate(k).getTime() - 1, ser: s }); } });
    items.sort(function (a, b) { return a.at - b.at; });
    var title = state.sport === 'alle' ? 'Alle kommenden Termine' : SPORTS[state.sport] + ': alle kommenden Termine';
    var html = '<h2>' + esc(title) + '</h2><p class="sub">' + items.length + (items.length === 1 ? ' Termin' : ' Termine') + ' · Antippen springt im Kalender zum Tag</p>';
    var LIMIT = 14, cut = !state.more && items.length > LIMIT;
    var shown = cut ? items.slice(0, LIMIT) : items, lastM = '';
    shown.forEach(function (x) {
      var m = monthFmt.format(keyDate(x.k));
      if (m !== lastM) { html += '<div class="lm">' + esc(m) + '</div>'; lastM = m; }
      var kd = keyDate(x.k), dl = dowShort.format(kd).replace('.', '') + ' ' + parseKey(x.k).d + '.';
      if (x.ev) {
        var e = x.ev, sub = [e.comp, e.place, e.why && e.sport !== 'fussball' ? e.why : (e.bayern ? '' : e.why), e.note].filter(Boolean).join(' · ');
        html += '<button class="lr s-' + e.sport + (e.bayern ? ' fcb' : '') + '" type="button" data-k="' + x.k + '"><span class="ld">' + esc(dl) + '</span><span class="lt">' + (e.timed ? (e.tent ? 'ca. ' : '') + hhmm(e.t0) + ' Uhr' : 'Zeit offen') + '</span>' +
          '<span class="lb"><b>' + esc(e.home) + '<em>–</em>' + esc(e.away) + '</b><span>' + esc(SPORTS[e.sport] + ' · ' + sub) + '</span></span></button>';
      } else {
        var s = x.ser, rng = dayMonthShort.format(keyDate(s.from)) + ' bis ' + dayMonthShort.format(keyDate(s.to));
        html += '<button class="lr sr s-' + s.sport + '" type="button" data-k="' + x.k + '"><span class="ld">' + esc(dl) + '</span><span class="lt">Turnier</span>' +
          '<span class="lb"><b>' + esc(s.name) + '</b><span>' + esc(SPORTS[s.sport] + ' · ' + s.tour + (s.place ? ' · ' + s.place : '') + ' · ' + rng + (s.note ? ' · ' + s.note : '')) + '</span></span></button>';
      }
    });
    if (!items.length) html += '<div class="empty">Keine kommenden Termine in dieser Sportart.</div>';
    if (cut) html += '<button class="more-btn" type="button" id="more">Alle ' + items.length + ' anzeigen</button>';
    document.getElementById('all').innerHTML = html;
  }

  var TBL_NOTE = { bl: 'Markiert sind die aktuellen Top 4 und Bayern.', pl: 'Markiert sind die Big Six.', ll: 'Markiert sind Real Madrid, Barcelona und Atlético.', sa: 'Markiert sind Inter, Milan, Juventus und Neapel.', l1: 'Markiert sind Paris Saint-Germain und Monaco.', cl: 'Ligaphase. Markiert ist Bayern. Platz 1 bis 8 direkt weiter, 9 bis 24 in die Play-offs.' };
  var MX_TAG = { bl: 'Top-4-Duell', pl: 'Big-Six-Duell', ll: 'Top-3-Duell', sa: 'Gipfeltreffen', l1: 'PSG gegen Monaco', cl: 'Top-Duell' };
  var MX_NOTE = { bl: 'Hervorgehoben sind Bayern-Spiele und Duelle der aktuellen Top 4.', pl: 'Hervorgehoben sind die Duelle der Big Six.', ll: 'Hervorgehoben sind die Duelle von Real, Barcelona und Atlético.', sa: 'Hervorgehoben sind die Duelle von Inter, Milan, Juventus und Neapel.', l1: 'Hervorgehoben ist Paris Saint-Germain gegen Monaco.', cl: 'Hervorgehoben sind Bayern, Duelle der Teams aus deinen Ligen und, grau, alle anderen deutschen Teams (Dortmund, Stuttgart, Leipzig).' };
  function shortD(k) { var p = parseKey(k); return p.d + '.' + p.m + '.'; }

  function tableBlock(cur) {
    return '<div class="tbl" role="table" aria-label="' + esc(cur.name) + '">' +
      '<div class="th" role="columnheader">#</div><div class="th" role="columnheader">Team</div><div class="th n" role="columnheader">Sp</div><div class="th n" role="columnheader">S</div><div class="th n" role="columnheader">U</div><div class="th n" role="columnheader">N</div><div class="th n" role="columnheader">Pkt</div>' +
      cur.rows.map(function (r) {
        var cls = (r.hl ? ' hl' : '') + (r.hl && /Bayern/.test(r.t) ? ' fcbrow' : '');
        return '<div class="rk' + cls + '">' + r.r + '</div><div class="' + cls.trim() + '">' + esc(r.t) + '</div><div class="n' + cls + '">' + r.sp + '</div><div class="n' + cls + '">' + r.w + '</div><div class="n' + cls + '">' + r.d + '</div><div class="n' + cls + '">' + r.l + '</div><div class="n pts' + cls + '">' + r.p + '</div>';
      }).join('') + '</div><p class="tbl-note">' + esc(TBL_NOTE[cur.key] || '') + ' Stand ' + esc(stampFmt.format(new Date(data.tablesAsOf || data.asOf))) + ' Uhr, ohne Tordifferenz.</p>';
  }

  function roundBlock(cur, c) {
    var f = fixtures[cur.key];
    if (!f) return '<p class="tbl-note">Für diese Liga liegt noch kein Spielplan vor.</p>';
    var n = state.rd[cur.key] || curRound(f, c.today);
    if (n < 1) n = 1; if (n > f.total) n = f.total;
    var rr = f.byN[n];
    var isCL = cur.key === 'cl';
    var opts = '';
    for (var i = 1; i <= f.total; i++) {
      var r0 = f.byN[i];
      opts += '<option value="' + i + '"' + (i === n ? ' selected' : '') + '>' + (isCL ? 'Ligaphase, Spieltag ' : 'Spieltag ') + i + ' · ' + (r0 ? (r0.first === r0.last ? shortD(r0.first) : shortD(r0.first) + ' bis ' + shortD(r0.last)) : 'folgt') + '</option>';
    }
    var html = '<div class="rd-nav"><button class="ibtn" type="button" data-rd="-1" aria-label="Vorheriger Spieltag"' + (n <= 1 ? ' disabled' : '') + '>&#8249;</button>' +
      '<h3>' + (isCL ? 'Spieltag ' : 'Spieltag ') + n + '</h3>' +
      '<button class="ibtn" type="button" data-rd="1" aria-label="Nächster Spieltag"' + (n >= f.total ? ' disabled' : '') + '>&#8250;</button>' +
      '<select data-rdsel="1" aria-label="Spieltag wählen">' + opts + '</select>' +
      '<button class="tbtn" type="button" data-rd="cur">Aktuell</button></div>';
    if (!rr) {
      return html + '<p class="tbl-note">Der Spielplan für diesen Spieltag liegt noch nicht vor. Das Board zeigt ihn, sobald er in den Sportdaten steht.</p>';
    }
    var anyOpen = rr.ms.some(function (m) { return !m.timed; });
    var span = rr.first === rr.last ? dowShort.format(keyDate(rr.first)).replace('.', '') + ' ' + dayMonthShort.format(keyDate(rr.first)) : dayMonthShort.format(keyDate(rr.first)) + ' bis ' + dayMonthShort.format(keyDate(rr.last));
    html += '<p class="rd-sub">' + esc((isCL ? 'Ligaphase · ' : '') + span + ' · ' + rr.ms.length + ' Spiele' + (rr.ms.every(function (m) { return !m.timed; }) ? ' · Tage und Anstoßzeiten noch nicht angesetzt' : '')) + '</p>';
    var lastKey = null;
    rr.ms.forEach(function (m) {
      var hn = f.teams[m.h], an = f.teams[m.a];
      var header = m.timed ? m.key : 'open';
      if (header !== lastKey) {
        lastKey = header;
        if (m.timed) html += '<div class="md">' + esc(dowShort.format(keyDate(m.key)).replace('.', '') + ' ' + dayMonthShort.format(keyDate(m.key))) + (m.key === c.today ? '<span class="tag"><span>Heute</span></span>' : '') + '</div>';
        else html += '<div class="md">' + esc('Ab ' + dowShort.format(keyDate(m.key)).replace('.', '') + ' ' + dayMonthShort.format(keyDate(m.key))) + '<small>genauer Tag und Anstoß noch offen</small></div>';
      }
      var bay = /Bayern/.test(hn + ' ' + an);
      var cls = 'mx' + (m.fl === 1 ? (bay ? ' fcb' : ' hl') : m.fl === 2 ? ' de' : '') + (m.timed ? '' : ' open');
      var tag = m.fl === 1 ? (bay ? 'FC Bayern' : (MX_TAG[cur.key] || '')) : m.fl === 2 ? 'Deutsches Team' : '';
      var live = m.timed && !m.sc && m.t0 <= c.now && c.now < new Date(m.t0.getTime() + 115 * 60000);
      var res = m.sc ? m.sc.replace('-', ':') : live ? 'läuft' : '';
      html += '<div class="' + cls + '"><span class="mt">' + (m.timed ? hhmm(m.t0) : 'offen') + '</span><span class="mm"><b>' + esc(hn) + '<em>–</em>' + esc(an) + '</b>' + (tag ? '<small>' + esc(tag) + '</small>' : '') + '</span><span class="ms' + (live ? ' live' : '') + '">' + esc(res) + '</span></div>';
    });
    html += '<p class="tbl-note">' + esc(MX_NOTE[cur.key] || '') + ' Anstoßzeiten in Berliner Zeit. Stand ' + esc(stampFmt.format(new Date(data.fixturesAsOf || data.asOf))) + ' Uhr.' + (anyOpen ? ' Spiele ohne Uhrzeit sind noch nicht angesetzt.' : '') + '</p>';
    return html;
  }

  function renderTables() {
    var el = document.getElementById('tbl');
    var tabs = data.tables || [];
    if (!tabs.length) { el.innerHTML = ''; return; }
    var c = nowInfo();
    var cur = tabs.filter(function (t) { return t.key === state.tbl; })[0] || tabs[0];
    var hasFx = !!fixtures[cur.key];
    var view = hasFx ? state.view : 'tab';
    el.innerHTML = '<h2>Tabellen und Spieltage</h2><div class="tbl-bar"><div class="tbl-tabs" role="group" aria-label="Liga">' + tabs.map(function (t) {
      return '<button class="ttab" type="button" data-tbl="' + esc(t.key) + '" aria-pressed="' + (t.key === cur.key) + '"><span>' + esc(t.name) + '</span></button>';
    }).join('') + '</div>' +
      '<div class="tbl-tabs" role="group" aria-label="Ansicht"><button class="ttab v" type="button" data-view="tab" aria-pressed="' + (view === 'tab') + '"><span>Tabelle</span></button>' +
      '<button class="ttab v" type="button" data-view="spt" aria-pressed="' + (view === 'spt') + '"><span>Spieltage</span></button></div></div>' +
      (view === 'tab' ? tableBlock(cur) : roundBlock(cur, c));
  }

  function renderStatic() {
    var nl = document.getElementById('notes'); if (nl) nl.innerHTML = data.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('');
  }

  function render() {
    var c = nowInfo();
    var avail = tabAvail();
    if (state.page === 'tab' && !avail) state.page = 'heute';
    document.body.className = 'th-' + state.sport;
    document.getElementById('wm').textContent = EMO[state.sport];
    renderHeader(c); renderFilters(c); renderTabbar(avail);
    PAGES.forEach(function (p) { document.getElementById('v-' + p.k).hidden = state.page !== p.k; });
    if (state.page === 'heute') renderToday(c);
    else if (state.page === 'kal') { renderCal(c); renderDetail(c); }
    else if (state.page === 'liste') renderAll(c);
    else if (state.page === 'tab') renderTables();
  }

  function setPage(p) { state.page = p; persist(); render(); window.scrollTo(0, 0); }
  function select(k) { state.sel = k; if (ymOf(k) >= minYM && ymOf(k) <= maxYM) state.month = ymOf(k); state.page = 'kal'; persist(); render(); window.scrollTo(0, 0); }

  document.getElementById('grid').addEventListener('click', function (ev) { var b = ev.target.closest('[data-k]'); if (b) { state.sel = b.getAttribute('data-k'); render(); var f = document.querySelector('.day.sel'); if (f) f.focus({ preventScroll: true }); } });
  document.getElementById('v-heute').addEventListener('click', function (ev) {
    var p = ev.target.closest('[data-page]'); if (p) { setPage(p.getAttribute('data-page')); return; }
    var b = ev.target.closest('[data-k]'); if (b) select(b.getAttribute('data-k'));
  });
  document.getElementById('tabbar').addEventListener('click', function (ev) { var b = ev.target.closest('[data-page]'); if (b) setPage(b.getAttribute('data-page')); });
  document.getElementById('filters').addEventListener('click', function (ev) { var b = ev.target.closest('[data-sport]'); if (!b) return; state.sport = b.getAttribute('data-sport'); state.more = false; persist(); render(); });
  function refocus(sel) { try { var f = document.querySelector(sel); if (f && f.focus) f.focus({ preventScroll: true }); } catch (e) {} }
  function onTbl(ev) {
    var b = ev.target.closest('[data-tbl]');
    if (b) { state.tbl = b.getAttribute('data-tbl'); renderTables(); return; }
    b = ev.target.closest('[data-view]');
    if (b) { state.view = b.getAttribute('data-view'); renderTables(); return; }
    b = ev.target.closest('[data-rd]');
    if (b) {
      var f = fixtures[state.tbl]; if (!f) return;
      var c = nowInfo(), v = b.getAttribute('data-rd'), n = state.rd[state.tbl] || curRound(f, c.today);
      n = v === 'cur' ? curRound(f, c.today) : n + (+v);
      state.rd[state.tbl] = Math.max(1, Math.min(f.total, n));
      renderTables();
      refocus('[data-rd="' + (v === 'cur' ? 'cur' : v) + '"]');
    }
  }
  function onSel(ev) {
    var t = ev.target;
    if (!t || !t.getAttribute || !t.getAttribute('data-rdsel')) return;
    var f = fixtures[state.tbl]; if (!f) return;
    state.rd[state.tbl] = Math.max(1, Math.min(f.total, +t.value || 1));
    renderTables();
    refocus('[data-rdsel]');
  }
  var tblEl = document.getElementById('tbl'); tblEl.addEventListener('click', onTbl); tblEl.addEventListener('change', onSel);
  document.getElementById('all').addEventListener('click', function (ev) {
    if (ev.target.closest('#more')) { state.more = true; renderAll(nowInfo()); return; }
    var b = ev.target.closest('[data-k]'); if (b) select(b.getAttribute('data-k'));
  });
  function shift(n) { var p = state.month.split('-'); var d = mk(+p[0], +p[1] + n, 1); var ym = keyOfUTC(d).slice(0, 7); if (ym < minYM || ym > maxYM) return; state.month = ym; render(); }
  document.getElementById('prev').addEventListener('click', function () { shift(-1); });
  document.getElementById('nextm').addEventListener('click', function () { shift(1); });
  document.getElementById('gotoday').addEventListener('click', function () { select(nowInfo().today); });

  renderStatic();
  render();
  setInterval(function () { var c = nowInfo(); renderHeader(c); if (state.page === 'heute') renderToday(c); }, 60000);
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
